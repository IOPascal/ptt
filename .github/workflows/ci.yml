name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Windows runners have no openssl on PATH by default: exercise the
      # 'cryptography' fallback path for certificate generation instead.
      - name: Install cryptography (Windows only)
        if: runner.os == 'Windows'
        run: pip install cryptography

      - name: Syntax check
        run: python -m compileall -q ptt tests

      - name: Smoke-test starter script (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./ptt.sh --version

      - name: Smoke-test starter script (Windows)
        if: runner.os == 'Windows'
        run: .\ptt.cmd --version

      - name: Run tests
        run: python -m unittest discover -s tests -v
