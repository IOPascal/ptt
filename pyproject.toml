[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ptt-private-terminal-tunnel"
dynamic = ["version"]
description = "PTT - Private Terminal Tunnel: terminal access over TLS in your LAN"
readme = "README.md"
requires-python = ">=3.9"
license = "EUPL-1.2"
license-files = ["LICENSE*"]
classifiers = [
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
]

[project.scripts]
ptt = "ptt.cli:main"

[tool.setuptools.packages.find]
include = ["ptt*"]

[tool.setuptools.dynamic]
version = { attr = "ptt.__version__" }
